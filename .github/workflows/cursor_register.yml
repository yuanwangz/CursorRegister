name: Cursor Register

on:
  workflow_dispatch:
    inputs:
      number:
        default: "2"
        type: number
      max_workers:
        default: "1"
        type: number
      ingest_to_oneapi:
        description: 'Ingest account tokens to OneAPI'
        type: boolean
      ingest_to_custom_api:
        description: 'Ingest account tokens to Custom API'
        type: boolean
      upload_artifact:
        description: 'Upload account infos to artifact'
        type: boolean
        default: true
      email-cycle:
        description: 'Enable email account cycle flow'
        type: boolean
        default: false
      email:
        description: 'Email address for cycle flow'
        type: string
        required: false
      password:
        description: 'Email password for cycle flow'
        type: string
        required: false

jobs:
  build:
    runs-on: windows-latest
    env:
      HIDE_ACCOUNT_INFO: "true"
      ENABLE_BROWSER_LOG: "false"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requirements
        run: |
          pip3 install -r ./requirements.txt
          
      # Email循环流程 - 使用OneAPI
      - name: Run Gmail cycle with OneAPI
        if: ${{ github.event.inputs.email-cycle == 'true' && github.event.inputs.ingest_to_oneapi == 'true' }}
        run: |
          python3 ./cursor_register_v2.py --email-cycle --email "${{ github.event.inputs.email }}" --password "${{ github.event.inputs.password }}" --oneapi --oneapi_url "${{ secrets.CURSOR_ONEAPI_URL }}" --oneapi_token "${{ secrets.CURSOR_ONEAPI_TOKEN }}" --oneapi_channel_url "${{ secrets.CURSOR_CHANNEL_URL }}"
          
      # Email循环流程 - 使用Custom API
      - name: Run Gmail cycle with Custom API
        if: ${{ github.event.inputs.email-cycle == 'true' && github.event.inputs.ingest_to_custom_api == 'true' }}
        run: |
          python3 ./cursor_register_v2.py --email-cycle --email "${{ github.event.inputs.email }}" --gmail-password "${{ github.event.inputs.password }}" --custom-api --api_url "${{ secrets.CUSTOM_API_URL }}"
          
      # Email循环流程 - 不使用API
      - name: Run Gmail cycle without API
        if: ${{ github.event.inputs.email-cycle == 'true'  && github.event.inputs.ingest_to_oneapi == 'false' && github.event.inputs.ingest_to_custom_api == 'false' && github.event.inputs.upload_artifact == 'true' }}
        run: |
          python3 ./cursor_register_v2.py --email-cycle --email "${{ github.event.inputs.email }}" --password "${{ github.event.inputs.password }}"
          
      # 常规注册流程 - OneAPI
      - name: Run script for OneAPI
        if: ${{ github.event.inputs.email-cycle != 'true' && github.event.inputs.ingest_to_oneapi == 'true' }}
        run: |
          python3 ./cursor_register_v2.py --oneapi --oneapi_url "${{ secrets.CURSOR_ONEAPI_URL }}" --oneapi_token "${{ secrets.CURSOR_ONEAPI_TOKEN }}" --oneapi_channel_url "${{ secrets.CURSOR_CHANNEL_URL }}" --number ${{ github.event.inputs.number }} --max_workers ${{ github.event.inputs.max_workers }} 
          
      # 常规注册流程 - Custom API
      - name: Run script for Custom API
        if: ${{ github.event.inputs.email-cycle != 'true' && github.event.inputs.ingest_to_custom_api == 'true' }}
        run: |
          python3 ./cursor_register_v2.py --custom-api --api_url "${{ secrets.CUSTOM_API_URL }}" --number ${{ github.event.inputs.number }} --max_workers ${{ github.event.inputs.max_workers }}
          
      # 常规注册流程 - 不使用API
      - name: Run script for csv
        if: ${{ github.event.inputs.email-cycle != 'true' && github.event.inputs.ingest_to_oneapi == 'false' && github.event.inputs.ingest_to_custom_api == 'false' && github.event.inputs.upload_artifact == 'true' }}
        run: |
          python3 ./cursor_register_v2.py --number ${{ github.event.inputs.number }} --max_workers ${{ github.event.inputs.max_workers }}       
          
      # 上传结果
      - name: Upload csv files to artifact
        if: ${{ github.event.inputs.upload_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: "Account Info"
          path: "*.csv"
          retention-days: 1
